# Nothing may talk to anything that is not named here. The way to the API of the cluster is different on each cloud, so it stands
# in the folder of the cloud.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nothing
  namespace: shop
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: names
  namespace: shop
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: front
  namespace: shop
spec:
  podSelector:
    matchLabels:
      app: front
  policyTypes: [Ingress, Egress]
  ingress:
    # From anywhere: this is the way in.
    - ports:
        - {protocol: TCP, port: 8080}
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
        - podSelector:
            matchLabels:
              app: walker
      ports:
        - {protocol: TCP, port: 9100}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: standin
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - {protocol: TCP, port: 9090}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: standin
  namespace: shop
spec:
  podSelector:
    matchLabels:
      app: standin
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: front
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus
  namespace: shop
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: front
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argo-rollouts
          podSelector:
            matchLabels:
              app.kubernetes.io/name: argo-rollouts
      ports:
        - {protocol: TCP, port: 9090}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: front
      ports:
        - {protocol: TCP, port: 9100}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argo-rollouts
          podSelector:
            matchLabels:
              app.kubernetes.io/name: argo-rollouts
      ports:
        - {protocol: TCP, port: 8090}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: walker
  namespace: shop
spec:
  podSelector:
    matchLabels:
      app: walker
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: front
      ports:
        - {protocol: TCP, port: 9100}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nothing
  namespace: argo-rollouts
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shop
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - {protocol: TCP, port: 8090}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shop
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - {protocol: TCP, port: 9090}
