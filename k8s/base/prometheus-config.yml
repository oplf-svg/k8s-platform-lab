# It asks two fixed addresses, so it needs no right in the cluster.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
scrape_configs:
  - job_name: front
    static_configs:
      - targets:
          - tally:9100
  - job_name: rollouts
    static_configs:
      - targets:
          - argo-rollouts-metrics.argo-rollouts.svc:8090
