# The way to the API of the cluster, for the two that need it. In kind it is a container in a private network of Docker.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
  namespace: shop
spec:
  podSelector:
    matchLabels:
      app: walker
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 172.16.0.0/12
      ports:
        - {protocol: TCP, port: 6443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
  namespace: argo-rollouts
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argo-rollouts
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 172.16.0.0/12
      ports:
        - {protocol: TCP, port: 6443}
