# The front. It stays the same while releases come and go, and it writes one line for each answer.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 1024;
}

http {
  # It runs without rights and on a file system that cannot be written to, apart from /tmp and the list.
  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Written at once and to a file of its own. The log of a container is cut off at 10 MB without a word.
  log_format answers escape=json
    '{"id":"$http_webhook_id","path":"$uri","status":"$status","upstream":"$upstream_status",'
    '"release":"$upstream_http_x_release","pod":"$upstream_http_x_pod","seconds":"$request_time","at":"$msec"}';

  access_log off;
  server_tokens off;
  client_max_body_size 256k;

  server {
    listen 8080;

    location /hooks/ {
      access_log /var/log/front/answers.jsonl answers;
      limit_except POST {
        deny all;
      }
      proxy_pass http://standin:80;

      # Each of these would hide an error or spoil the share of the new pods.
      proxy_next_upstream off;
      proxy_http_version 1.0;
      proxy_set_header Connection close;
      proxy_intercept_errors off;

      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
      # A client that goes away does not cancel the request to the pod, so the pod's answer is still in the list.
      proxy_ignore_client_abort on;
    }

    # Marks the first and the last line of a run, so that a list that was cut off is noticed.
    location /mark/ {
      access_log /var/log/front/answers.jsonl answers;
      return 204;
    }

    # The list and what the controller says are read here, so nobody needs a right in the cluster for it. It is all made up.
    location = /lists/answers {
      if ($is_args) {
        return 404;
      }
      default_type application/x-ndjson;
      alias /var/log/front/answers.jsonl;
    }

    # One fixed question, and nothing can be added to it.
    location = /status/release {
      if ($is_args) {
        return 404;
      }
      limit_except GET {
        deny all;
      }
      proxy_pass http://prometheus:9090/api/v1/query?query=rollout_info;
    }

    location / {
      return 404;
    }
  }
}
